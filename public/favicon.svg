<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#f4f2ee" rx="8"/>
  
  <!-- Large honeycomb hexagons -->
  <g fill="none" stroke="#c08a2e" stroke-width="2.5">
    <!-- Center hexagon -->
    <polygon points="50,20 65,28 65,44 50,52 35,44 35,28"/>
    
    <!-- Top left -->
    <polygon points="28,20 43,28 43,44 28,52 13,44 13,28"/>
    
    <!-- Top right -->
    <polygon points="72,20 87,28 87,44 72,52 57,44 57,28"/>
    
    <!-- Middle left -->
    <polygon points="20,50 35,58 35,74 20,82 5,74 5,58"/>
    
    <!-- Middle right -->
    <polygon points="80,50 95,58 95,74 80,82 65,74 65,58"/>
    
    <!-- Bottom center -->
    <polygon points="50,72 65,80 65,96 50,104 35,96 35,80"/>
  </g>
</svg>
